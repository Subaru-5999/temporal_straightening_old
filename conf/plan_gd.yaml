defaults:
  - _self_
  # Single-GPU B200 pod (no SLURM): run locally. Switch back to submitit_slurm on a cluster.
  - override hydra/launcher: submitit_local

hydra:
  run:
    dir: plan_outputs_gd/${replace_slash:${model_name}}_gH${goal_H}_${goal_source}/${ckpt_base_path}_gd_lr${planner.sub_planner.lr}_an${planner.sub_planner.action_noise}_opt${planner.sub_planner.opt_steps}_obj${objective.mode}${corridor_tag:${objective.corridor_beta},${objective.corridor_rho}}_init${planner.sub_planner.sample_type}
  sweep:
    dir: plan_outputs_gd/${replace_slash:${model_name}}_gH${goal_H}_${goal_source}/${ckpt_base_path}_gd_lr${planner.sub_planner.lr}_an${planner.sub_planner.action_noise}_opt${planner.sub_planner.opt_steps}_obj${objective.mode}${corridor_tag:${objective.corridor_beta},${objective.corridor_rho}}_init${planner.sub_planner.sample_type}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    nodes: 1
    tasks_per_node: 1
    gpus_per_node: 1
    cpus_per_task: 16
    mem_gb: 64
    timeout_min: 720

ckpt_base_path: ./checkpoints # model to load for planning
model_name: null
model_epoch: latest

seed: 100
n_evals: 50
# GD eval-batch chunk size. null = plan all n_evals in one batch (original/paper-faithful).
# Set e.g. 10 to split planning into memory-bounded sub-batches (identical results, lower
# peak memory) so long-horizon rollouts fit small GPUs / MIG slices without dropping n_evals.
plan_chunk_size: null
goal_source: 'dset'
goal_H: 25 
n_plot_samples: 10
decode_for_viz: true  # if false, skip world-model decoding/rollout visualization during eval
num_start_frames: 1

debug_dset_init: False

objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 0
  base: 2 
  mode: last
  # LATENT GEODESIC CORRIDOR (NOVEL; 0.0 = paper exactly, same function object, no wrapper).
  # Charges the PREDICTED latent path for bowing SIDEWAYS off the straight segment z_0 -> z_g,
  # while leaving progress ALONG the segment free. `mode=last` constrains only the endpoint, so
  # the interior of the plan is unconstrained and a 100-step Adam optimiser is free to find
  # action sequences the model wrongly believes reach the goal. See planning/objectives.py
  # ::corridor_penalty for the derivation and for why this is NOT `mode=all`.
  # Requires NO retraining -- it runs on existing checkpoints.
  corridor_beta: 0.0
  # Dead zone on the normalised sideways deviation. MEASURE it from real dataset segments
  # (diagnose_planning.py --corridor-stats) rather than tuning it against success.
  corridor_rho: 0.0

planner:
  _target_: planning.mpc.MPCPlanner
  max_iter: 1
  n_taken_actions: 25
  sub_planner:
    target: planning.gd.GDPlanner
    lr: 0.1
    sample_type: zero
    action_noise: 0
    horizon: 25
    var_scale: 1
    opt_steps: 100
    eval_every: -1
  name: mpc_gd
