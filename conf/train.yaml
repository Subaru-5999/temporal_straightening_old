defaults:
  - _self_
  - env: point_maze
  - encoder: dino 
  - action_encoder: proprio
  - proprio_encoder: proprio
  - decoder: vqvae
  - predictor: vit
  # Single-GPU B200 pod (no SLURM): run jobs locally.
  # For a SLURM cluster, switch this back to `submitit_slurm` and restore gres/qos/setup below.
  - override hydra/launcher: submitit_local

# base path to save model outputs. Checkpoints will be saved to ${ckpt_base_path}
ckpt_base_path: ./checkpoints

hydra:
  run:
    dir: ${ckpt_base_path}/test/${oc.select:env.save_name,${env.name}}_${replace_substring:${training.straighten},agg,agg${oc.select:encoder.agg_type,}}_agg32_proj${oc.select:encoder.projector,none}_dim${oc.select:encoder.projector_out_dim,384}_hw${oc.select:encoder.projector_target_hw,14}_sg${training.stop_grad}_lr${training.encoder_lr}${straighten_tag:${training.straighten_scales},${training.straighten_lambdas},${training.straighten_scale_weights}}
  sweep:
    dir: ${ckpt_base_path}/test/${oc.select:env.save_name,${env.name}}_${replace_substring:${training.straighten},agg,agg${oc.select:encoder.agg_type,}}_agg32_proj${oc.select:encoder.projector,none}_dim${oc.select:encoder.projector_out_dim,384}_hw${oc.select:encoder.projector_target_hw,14}_sg${training.stop_grad}_lr${training.encoder_lr}${straighten_tag:${training.straighten_scales},${training.straighten_lambdas},${training.straighten_scale_weights}}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    nodes: 1
    tasks_per_node: 1
    gpus_per_node: 1
    cpus_per_task: 8
    mem_gb: 64
    timeout_min: 2880

training:
  seed: 0
  epochs: 20
  batch_size: 32 # should >= nodes * tasks_per_node
  save_every_x_epoch: 1
  save_every_x_iterations: 1000
  straighten: False  # e.g. cos1e-2 or aggcos1e-2
  # ---- Multi-scale (hierarchical) straightening: NOVEL extension, single-scale by default ----
  # straighten_scales=null (or [1]) reproduces the paper exactly. Set e.g. [1,3,5,10] to also
  # straighten at coarser temporal scales. Requires the encoder to be trainable and
  # `straighten` enabled (e.g. aggcos1e-1). Curvature at scale s needs >= 2s+1 latent frames,
  # i.e. trajectories >= (2*max_scale+1)*frameskip env-steps (PushT ok for s<=10; PointMaze
  # len-100 only supports smaller scales). The overall lambda is still `straighten` (e.g. 0.1).
  straighten_scales: null
  # ---- Per-scale coefficients: choose ONE of the two below ----
  # (A) straighten_lambdas (PREFERRED for ablations): ABSOLUTE lambda per scale, same length as
  #     straighten_scales. loss = MSE + sum_s lambda_s * L_curv^(s). Takes precedence over the
  #     legacy weights. A lambda of 0 fully switches that scale OFF (loss term AND its data-window
  #     requirement), so e.g. straighten_scales=[1,4] straighten_lambdas=[0.1,0] == paper single-scale.
  #     Example (s=4 run): straighten_scales=[1,4] straighten_lambdas=[0.1,0.2]
  straighten_lambdas: null
  # (B) straighten_scale_weights (LEGACY): multipliers on the global scale from `straighten`
  #     (aggcos1e-1 -> 0.1); effective coefficient = 0.1 * w_s. null = all 1.0.
  straighten_scale_weights: null
  straighten_goal_weight: 0.0      # mu>0 adds the directional term (pseudo-goal = window's last frame)
  decoder_start_epoch: 1  # start optimizing decoder at this epoch
  reconstruct_every_x_batch: 1000
  num_reconstruct_samples: 5
  encoder_lr: 1e-5
  decoder_lr: 3e-4
  predictor_lr: 5e-4
  action_encoder_lr: 5e-4
  stop_grad: True
  vcreg: False
  vcreg_apply_to: "enc"
  vcreg_std_coeff: 0
  vcreg_cov_coeff: 0
  mixed_precision: bf16
  # Resume from a specific checkpoint (absolute path to a model_<epoch>.pth).
  # Leave null to auto-resume from model_latest.pth in this run's checkpoints/ folder.
  # Resuming is fully offline: the encoder (incl. DINOv2 weights) is stored in the ckpt.
  # Example: training.resume_from=/workspace/arun/.../checkpoints/model_10.pth
  resume_from: null

img_size: 224 # should be a multiple of 224
frameskip: 5
concat_dim: 1

normalize_action: True

# action encoder
action_emb_dim: 10
num_action_repeat: 1

# proprio encoder
proprio_emb_dim: 10 
num_proprio_repeat: 1

num_hist: 3
num_pred: 1 # only supports 1
has_predictor: True # set this to False for only training a decoder
has_decoder: True # set this to False for only training a predictor

model:
  _target_: models.visual_world_model.VWorldModel
  image_size: ${img_size}
  num_hist: ${num_hist}
  num_pred: ${num_pred}
  train_encoder: True
  train_predictor: True
  train_decoder: True

# Planning params for planning eval jobs launched during training
plan_settings: 
  # plan_cfg_path: conf/plan.yaml # set to null for no planning evals
  plan_cfg_path: null 
  planner: ['gd', 'cem']
  goal_source: ['dset', 'random_state']
  goal_H: [5]
  alpha: [0.1, 1]

debug: False 
